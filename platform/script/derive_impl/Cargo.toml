[package]
name = "makepad-script-derive-impl"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Expansion logic of makepad-script-derive (derive(Script), script!, script_mod!, ...), as a library"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/makepad/makepad/"
repository = "https://github.com/makepad/makepad/"

[dependencies]
makepad-micro-proc-macro = { path = "../../../libs/micro_proc_macro", version = "1.0.0" }

[features]
## Build against Rapid's token model (the library linked into Rapid's loader).
rapid = ["makepad-micro-proc-macro/rapid"]
