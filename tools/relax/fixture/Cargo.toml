[package]
name = "relax-provided-fixture"
version = "0.1.0"
edition = "2021"
description = "Relax provided-crate fixture: rustc builds the lib into the `relax` loader (feature host-shims); `relax run relax-provided-fixture` runs the bin with the lib bound to it"
license = "MIT OR Apache-2.0"
publish = false
default-run = "relax-provided-fixture"

[features]
# the generated shims (src/host_shims.rs, `makepad host-gen`); only the loader enables it
host-shims = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "relax-provided-fixture"
path = "src/main.rs"

# `relax run relax-provided-fixture-guard` must stop with "a field of `Registry` is read from
# Relax-compiled code"; under rustc it prints 1
[[bin]]
name = "relax-provided-fixture-guard"
path = "src/guard.rs"
