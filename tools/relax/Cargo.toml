[package]
name = "relax"
version = "0.1.0"
edition = "2021"
description = "relax: boots makepad apps from source (Relax plus the provided crates)"
license = "MIT OR Apache-2.0"
publish = false
# tests/ are `relax test` programs (they use makepad's macros), not cargo tests
autotests = false

[[bin]]
name = "relax"
path = "src/main.rs"

[dependencies]
relax-compiler = { workspace = true }
# provided crates (Relax binds their C-shaped fns to this binary's code; loader-core.md section 8)
relax-provided-fixture = { workspace = true, features = ["host-shims"] }
# fetching sources (`run <git url>`): Relax's git client (relax's `git` module) on the
# system's HTTP stack
relax-light-http = { workspace = true }
